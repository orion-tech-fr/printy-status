<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Printy Status</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: #64748b;
      font-size: 0.875rem;
    }

    .services {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .service {
      background: #1e293b;
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #334155;
    }

    .service-info h2 {
      font-size: 1rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
    }

    .service-url {
      font-size: 0.75rem;
      color: #64748b;
      font-family: monospace;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .status.online .status-dot {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    .status.offline .status-dot {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
      animation: none;
    }

    .status.checking .status-dot {
      background: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
    }

    .status.online { color: #22c55e; }
    .status.offline { color: #ef4444; }
    .status.checking { color: #f59e0b; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .footer {
      text-align: center;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid #334155;
    }

    .last-check {
      font-size: 0.75rem;
      color: #64748b;
      margin-bottom: 0.5rem;
    }

    .refresh-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .refresh-btn:hover {
      background: #2563eb;
    }

    .refresh-btn:disabled {
      background: #475569;
      cursor: not-allowed;
    }

    .response-time {
      font-size: 0.7rem;
      color: #64748b;
      margin-top: 0.25rem;
    }

    .all-systems {
      text-align: center;
      padding: 1rem;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 8px;
      margin-bottom: 1.5rem;
      color: #22c55e;
      font-weight: 500;
    }

    .all-systems.has-issues {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }

    .auto-refresh {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #64748b;
    }

    .auto-refresh input {
      accent-color: #3b82f6;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Printy Status</h1>
      <p class="subtitle">Etat des services en temps reel</p>
    </header>

    <div id="summary" class="all-systems">
      Verification en cours...
    </div>

    <div class="services" id="services">
      <div class="service" id="service-api">
        <div class="service-info">
          <h2>API Backend</h2>
          <div class="service-url">printy-api-0te4.onrender.com</div>
          <div class="response-time" id="api-response-time"></div>
        </div>
        <div class="status checking" id="status-api">
          <span class="status-dot"></span>
          <span>Verification...</span>
        </div>
      </div>

      <div class="service" id="service-frontend">
        <div class="service-info">
          <h2>Frontend</h2>
          <div class="service-url">3dprinty.vercel.app</div>
          <div class="response-time" id="frontend-response-time"></div>
        </div>
        <div class="status checking" id="status-frontend">
          <span class="status-dot"></span>
          <span>Verification...</span>
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="last-check" id="last-check">Derniere verification: -</div>
      <button class="refresh-btn" id="refresh-btn" onclick="checkAll()">
        Actualiser
      </button>
      <div class="auto-refresh">
        <input type="checkbox" id="auto-refresh" checked>
        <label for="auto-refresh">Auto-refresh (30s)</label>
      </div>
    </div>
  </div>

  <script>
    const services = [
      {
        id: 'api',
        name: 'API Backend',
        url: 'https://printy-api-0te4.onrender.com/api/health',
      },
      {
        id: 'frontend',
        name: 'Frontend',
        url: 'https://3dprinty.vercel.app',
      }
    ];

    let autoRefreshInterval = null;

    async function checkService(service) {
      const statusEl = document.getElementById(`status-${service.id}`);
      const responseTimeEl = document.getElementById(`${service.id}-response-time`);

      statusEl.className = 'status checking';
      statusEl.innerHTML = '<span class="status-dot"></span><span>Verification...</span>';

      const startTime = Date.now();

      try {
        const response = await fetch(service.url, {
          method: 'GET',
          mode: 'cors',
        });

        const responseTime = Date.now() - startTime;

        if (response.ok) {
          statusEl.className = 'status online';
          statusEl.innerHTML = '<span class="status-dot"></span><span>En ligne</span>';
          responseTimeEl.textContent = `${responseTime}ms`;
          return true;
        } else {
          throw new Error(`HTTP ${response.status}`);
        }
      } catch (error) {
        const responseTime = Date.now() - startTime;
        statusEl.className = 'status offline';
        statusEl.innerHTML = '<span class="status-dot"></span><span>Hors ligne</span>';
        responseTimeEl.textContent = responseTime > 100 ? `Timeout` : `Erreur`;
        return false;
      }
    }

    async function checkAll() {
      const btn = document.getElementById('refresh-btn');
      btn.disabled = true;
      btn.textContent = 'Verification...';

      const results = await Promise.all(services.map(checkService));

      const allOnline = results.every(r => r);
      const summaryEl = document.getElementById('summary');

      if (allOnline) {
        summaryEl.className = 'all-systems';
        summaryEl.textContent = 'Tous les systemes sont operationnels';
      } else {
        summaryEl.className = 'all-systems has-issues';
        summaryEl.textContent = 'Certains services rencontrent des problemes';
      }

      document.getElementById('last-check').textContent =
        `Derniere verification: ${new Date().toLocaleTimeString('fr-FR')}`;

      btn.disabled = false;
      btn.textContent = 'Actualiser';
    }

    function setupAutoRefresh() {
      const checkbox = document.getElementById('auto-refresh');

      checkbox.addEventListener('change', () => {
        if (checkbox.checked) {
          autoRefreshInterval = setInterval(checkAll, 30000);
        } else {
          clearInterval(autoRefreshInterval);
        }
      });

      // Start auto-refresh by default
      autoRefreshInterval = setInterval(checkAll, 30000);
    }

    // Initial check
    checkAll();
    setupAutoRefresh();
  </script>
</body>
</html>
